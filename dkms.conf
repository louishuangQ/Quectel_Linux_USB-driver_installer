# DKMS configuration for the Quectel USB serial drivers.
# Source tree (drivers/usb/serial/*.c + *.h) is staged at:
#   /usr/src/quectel-usb-2.0/
PACKAGE_NAME="quectel-usb"
PACKAGE_VERSION="2.0"
MAKE[0]="make KERNELDIR=/lib/modules/${kernelver}/build modules"
CLEAN="make KERNELDIR=/lib/modules/${kernelver}/build clean"

BUILT_MODULE_NAME[0]="option"
BUILT_MODULE_LOCATION[0]="drivers/usb/serial"
DEST_MODULE_LOCATION[0]="/kernel/drivers/usb/serial"

BUILT_MODULE_NAME[1]="usb_wwan"
BUILT_MODULE_LOCATION[1]="drivers/usb/serial"
DEST_MODULE_LOCATION[1]="/kernel/drivers/usb/serial"

BUILT_MODULE_NAME[2]="qcserial"
BUILT_MODULE_LOCATION[2]="drivers/usb/serial"
DEST_MODULE_LOCATION[2]="/kernel/drivers/usb/serial"

AUTOINSTALL="yes"
REMAKE_INITRD="no"
